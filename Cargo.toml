[package]
name = "zerlyth"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A privacy-first CLI for understanding unfamiliar codebases."
license = "MIT"
repository = "https://github.com/zyrndotio/Zerlyth"
readme = "README.md"
keywords = ["cli", "codebase", "developer-tools", "repository-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[workspace]
resolver = "2"
